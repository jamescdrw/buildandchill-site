heading: Everything else your property needs
cards:
- title: Building work and alterations
  text: Knock-throughs and steel beams, stud walls, plastering, porches, patios and garage conversions. Small jobs and large ones, managed the same way.
  image: /assets/img/maint-hall.jpg
  alt: Freshly plastered and decorated hallway with new oak doors
- title: Repairs and maintenance
  text: For homeowners, landlords and businesses. Doors, leaks, damaged walls, fixtures and the list of jobs that keeps getting longer.
  image: /assets/img/maint-door.jpg
  alt: Restored front door with brass fittings on an Edwardian red brick house
