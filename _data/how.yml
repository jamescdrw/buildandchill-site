heading: How a job runs
intro: 'One team for all the trades: building, plumbing, electrics, plastering, tiling and decorating. One point of contact from the first visit to the last.'
steps:
- title: Survey
  text: We visit, measure up and listen to what you want from the room.
- title: Design and price
  text: A clear written quote. If it's a Howdens kitchen, we help you finalise the plan with your depot.
- title: Strip-out
  text: Old units, suites and tiles removed and taken away. Floors and furniture protected.
- title: First fix
  text: Plumbing, electrics, walls and floors put right before anything new goes in.
- title: Fit
  text: Units, worktops, sanitaryware, tiling and appliances installed and connected.
- title: Finish and handover
  text: Sealant, skirting, decorating and a proper clean. We walk you round it before we leave.
