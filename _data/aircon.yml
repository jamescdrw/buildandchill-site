calc_heading: Work out your air con price
calc_intro: Answer a few questions for an instant installed price, including supply, fitting, F-Gas commissioning and standard electrical connection. We confirm the exact unit size on a free survey.
calc_note: Prices start from £1,495 fitted. Leicestershire and East Midlands postcodes get a local discount.
