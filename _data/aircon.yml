heading: Air conditioning, supplied and installed
paragraphs:
- We fit quality units at the best prices. Wall-mounted split systems that cool in summer and heat efficiently in winter, from the manufacturers that last. We survey the room, recommend the right size of unit, and fit it with tidy pipe runs, so it doesn't look like an afterthought.
brands:
- Samsung
- Fujitsu
- Panasonic
- Daikin
ticks:
- 'Homes: bedrooms, living rooms, home offices and garden rooms'
- 'Businesses: offices, shops, salons and server rooms'
- Single rooms or multi-split systems running several rooms from one outdoor unit
- Indoor and outdoor units mounted, pipework run in neat trunking
- Installed under REFCOM F-Gas registration, commissioned and tested
- Servicing, cleaning and repairs on existing systems
