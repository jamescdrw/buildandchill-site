heading: Bathrooms and en-suites
paragraphs:
- From a straight swap to a full re-plan with a walk-in shower, we take the room back to the walls and rebuild it. Waterproofing goes in before a single tile does, because that's the part you never see and the part that matters most.
ticks:
- Howdens bathroom furniture and sanitaryware
- Walk-in showers, wet rooms and tanking
- Wall and floor tiling, large format included
- Heated towel rails, LED mirrors and extractor fans
