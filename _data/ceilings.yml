heading: Commercial ceilings, fixed and fitted
intro: Offices, shops, schools, warehouses and units. We install new suspended ceilings and repair the ones you already have, with minimal disruption to the people working underneath.
image: /assets/img/ceiling.jpg
columns:
- title: New installs
  text: Suspended grid systems, mineral fibre and plasterboard tiles, MF ceilings and bulkheads, with LED panels set in.
- title: Repairs and replacements
  text: Water-stained or sagging tiles swapped, damaged grid straightened or replaced, and access hatches added for services.
- title: Out of hours
  text: Evening and weekend working, so your premises can stay open while the work gets done.
