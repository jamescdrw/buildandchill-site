heading: Howdens kitchens, fitted properly
paragraphs:
- 'Howdens make some of the best-value kitchens in the country. We fit them the way they deserve: level carcasses, tight scribes, clean worktop joints and doors that line up on day one and stay that way.'
- You pick your kitchen at your local Howdens depot, or we help you choose it. We handle everything else.
ticks:
- Strip-out of the old kitchen and removal from site
- Plumbing, electrics, plastering and tiling
- Laminate, solid wood and quartz worktops
- Integrated appliances connected and tested
- Flooring, skirting and decorating to finish
button: Talk about your kitchen
