title: Build & Chill Property Services
description: Kitchens, bathrooms, extensions, commercial ceilings and air conditioning installation in Leicester and Leicestershire.
url: https://buildandchill.co.uk
baseurl: ""
lang: en_GB
timezone: Europe/London
permalink: /blog/:title/
plugins:
  - jekyll-sitemap
  - jekyll-feed
feed:
  path: feed.xml
defaults:
  - scope: { path: "admin" }
    values: { sitemap: false }
exclude:
  - netlify.toml
  - _config_preview.yml
  - vendor
  - README.md
  - Gemfile
  - Gemfile.lock

# Where the website quote chat sends requests (the Build & Chill admin server)
enquiry_endpoint: ''
